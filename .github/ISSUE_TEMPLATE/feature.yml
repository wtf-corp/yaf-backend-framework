name: Feature request
description: Propose something YAF should do that it does not do yet.
title: "Feature: "
body:
  - type: markdown
    attributes:
      value: |
        An accepted feature becomes a spec under `specs/` before any code is written (ADR-0024). This issue is where that starts; `CONTRIBUTING.md` describes the process.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what stops you today.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Proposed outcome
      description: What should be possible once this exists. Describe the result, not the implementation.
    validations:
      required: true
