# Installed from docs/spec/factory/.github/workflows/factory-doc-review.yml: the factory's scripts, policy, prompts and schemas
# are used in place from docs/spec/factory/.github/factory/, and third-party actions are pinned by commit SHA.
# Review of a spec or a plan by an agent against the quality checklists (ADR-0024, ADR-0025, ADR-0029).
# Reports check `factory/doc-review`. Same layout and the same restrictions as factory-pr-review.yml.
#
# TEMPORARILY DISABLED. The model review does not run in CI: the factory-review environment has no working
# API account yet. Check `factory/doc-review` is run on a maintainer's machine by .github/scripts/local-review.mjs and
# posted by the reviewer app (see "Model reviews run locally" in AGENTS.md). This should move back to CI:
# fix the account, set repository variable FACTORY_REVIEW_IN_CI=true, point `factory/doc-review` in the main ruleset
# back at GitHub Actions (integration_id 15368), and delete the local script.
name: factory-doc-review

on:
  pull_request:
    branches: [main, next]
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

concurrency:
  group: factory-doc-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: doc-review
    # Off unless FACTORY_REVIEW_IN_CI is 'true' (see the note at the top of this file).
    if: ${{ vars.FACTORY_REVIEW_IN_CI == 'true' && !github.event.pull_request.draft && !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    environment: factory-review
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Kind of pull request and the reviewer the policy assigns
        id: scope
        run: node docs/spec/factory/.github/factory/scope.mjs --pr-dir pr --role docReviewer
      - name: Prompt and verdict schema from the base branch
        id: inputs
        if: steps.scope.outputs.kind != 'code'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          KIND: ${{ steps.scope.outputs.kind }}
        run: |
          {
            echo 'prompt<<FACTORY_PROMPT_EOF'
            cat docs/spec/factory/.github/factory/prompts/doc-review.md
            echo
            echo "Pull request: #${PR_NUMBER} in ${GITHUB_REPOSITORY}. Kind: ${KIND}. Base commit: ${BASE_SHA}. Head commit: ${HEAD_SHA}."
            echo 'FACTORY_PROMPT_EOF'
            echo "schema=$(tr -d '\n' < docs/spec/factory/.github/factory/doc-review.schema.json)"
          } >> "$GITHUB_OUTPUT"
      - name: Review (Claude)
        id: review
        if: steps.scope.outputs.kind != 'code' && steps.scope.outputs.agent == 'claude'
        uses: anthropics/claude-code-action@f431adaf77e0fecf918431e75a2b5b45b85af002 # v1.0.283
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          allowed_bots: yaf-factory
          prompt: ${{ steps.inputs.outputs.prompt }}
          claude_args: >-
            --model ${{ steps.scope.outputs.model }}
            --max-turns 40
            --allowedTools "Read,Grep,Glob,Bash(git -C pr diff *),Bash(git -C pr log *),Bash(git -C pr show *),mcp__github_inline_comment__create_inline_comment"
            --json-schema '${{ steps.inputs.outputs.schema }}'
      - name: Another vendor's reviewer is not wired in
        if: steps.scope.outputs.kind != 'code' && steps.scope.outputs.agent != 'claude'
        run: |
          echo "The policy assigns agent '${{ steps.scope.outputs.agent }}' to this review. Add a step that runs it with" \
               "prompts/doc-review.md and produces JSON matching doc-review.schema.json in REVIEW_OUTPUT." >&2
          exit 1
      - name: Report the verdict as a check and a summary comment
        if: always() && steps.scope.outputs.kind != 'code'
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_OUTPUT: ${{ steps.review.outputs.structured_output }}
        run: node docs/spec/factory/.github/factory/post-review.mjs --check factory/doc-review
