# Installed from docs/spec/factory/.github/workflows/factory-digest.yml: the factory's scripts, policy, prompts and schemas
# are used in place from docs/spec/factory/.github/factory/, and third-party actions are pinned by commit SHA.
# Daily digest of what the factory merged (ADR-0029): by tier, sizes, review rounds, what waits for a human.
name: factory-digest

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      hours:
        description: Look back this many hours
        default: '24'

permissions: {}

jobs:
  digest:
    name: digest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - env:
          GH_TOKEN: ${{ github.token }}
        run: node docs/spec/factory/.github/factory/digest.mjs "${{ inputs.hours || '24' }}"
