# Installed from docs/spec/factory/.github/workflows/factory-automerge.yml: the factory's scripts, policy, prompts and schemas
# are used in place from docs/spec/factory/.github/factory/, and third-party actions are pinned by commit SHA.
# Enables auto-merge (squash) on pull requests in tier low and medium, and in tier high once a human
# maintainer has approved the head commit. GitHub then merges when every required check has passed;
# this workflow decides nothing about quality. It also takes auto-merge off a pull request that is
# tier high and not approved, or that needs a human: for that it runs after every gates run, a failed
# one too, and while the factory is paused. The decision is made by automerge.mjs.
#
# It runs on `workflow_run`, i.e. from the default branch with the app credential, and never checks
# out or runs anything from the pull request. The merge is done with the factory app's token so that
# the push to main starts the pipeline (a merge by the default workflow token starts no workflow).
name: factory-automerge

on:
  workflow_run:
    workflows: [factory-gates]
    types: [completed]

permissions: {}

jobs:
  automerge:
    name: automerge
    if: github.event.workflow_run.event != 'merge_group'
    runs-on: ubuntu-latest
    environment: factory-merge            # holds the factory app's private key
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Paused?
        id: pause
        run: echo "paused=${{ vars.FACTORY_PAUSED }}" >> "$GITHUB_OUTPUT"
      - name: Check out the default branch (never the pull request)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Token of the factory app
        id: app
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
      - name: Arm or disarm auto-merge
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          FACTORY_PAUSED: ${{ steps.pause.outputs.paused }}
          GATES_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        # The script finds the pull request from HEAD_SHA through the API, never from the event's free text.
        run: node docs/spec/factory/.github/factory/automerge.mjs
