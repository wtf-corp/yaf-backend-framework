# Daily digest of what the factory merged (ADR-0029): by tier, sizes, review rounds, what waits for a human.
name: factory-digest

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      hours:
        description: Look back this many hours
        default: '24'

permissions: {}

jobs:
  digest:
    name: digest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/factory/digest.mjs "${{ inputs.hours || '24' }}"
